name: Publish Bubai CLI

on:
  push:
    tags:
      - 'cli-v*'
  workflow_dispatch:
    inputs:
      tag:
        description: Existing CLI release tag to publish
        required: true
        type: string

permissions: {}

jobs:
  package:
    if: github.repository == 'microvoid/bubai' && (github.event_name == 'push' || github.ref == 'refs/heads/main')
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: refs/tags/${{ env.RELEASE_TAG }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Check the release tag
        run: |
          git merge-base --is-ancestor HEAD origin/main || {
            echo 'The release tag must point to a commit on main.'
            exit 1
          }
          node <<'NODE'
          const pkg = require('./apps/cli/package.json');
          const tag = process.env.RELEASE_TAG;
          if (pkg.name !== '@bubx/cli' || pkg.private || tag !== `cli-v${pkg.version}`) {
            console.error(`Expected tag cli-v${pkg.version} for the public @bubx/cli package, got ${tag}`);
            process.exitCode = 1;
          }
          NODE
      - name: Install pnpm
        run: npm install --global "$(node -p 'require("./package.json").packageManager')"
      - run: pnpm --filter '@bubx/cli...' install --frozen-lockfile
      - run: pnpm --filter @bubx/cli typecheck
      - name: Pack and check the CLI
        working-directory: apps/cli
        run: |
          version=${RELEASE_TAG#cli-v}
          npm pack --pack-destination "$RUNNER_TEMP"
          mv "$RUNNER_TEMP/bubx-cli-$version.tgz" "$RUNNER_TEMP/bubai-cli.tgz"
          tar -xzf "$RUNNER_TEMP/bubai-cli.tgz" -C "$RUNNER_TEMP" package/dist/main.js
          test "$(node "$RUNNER_TEMP/package/dist/main.js" --version)" = "$version"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: bubai-cli
          path: ${{ runner.temp }}/bubai-cli.tgz
          if-no-files-found: error
          overwrite: true

  publish:
    needs: package
    runs-on: ubuntu-latest
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: bubai-cli
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Publish to npm with OIDC
        run: npm publish ./bubai-cli.tgz --access public --ignore-scripts
