appId: com.bubai.app.dev
---
- runFlow: ../../../tests/native/open-workspace.yaml
- extendedWaitUntil:
    visible:
      id: channel-row-general
    timeout: 60000
- tapOn:
    id: channel-row-general
- tapOn:
    id: message-input
- eraseText
- inputText: "Native draft regression"
- runFlow:
    when:
      platform: Android
    commands:
      - hideKeyboard
- assertVisible: "Native draft regression"
- stopApp
- launchApp
- extendedWaitUntil:
    visible:
      id: channel-row-general
    timeout: 60000
- retry:
    maxRetries: 2
    commands:
      - tapOn:
          id: channel-row-general
      - assertVisible:
          id: message-input
- assertVisible: "Native draft regression"
- tapOn:
    id: send-message
- assertVisible:
    id: message-input
