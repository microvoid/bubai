appId: com.bubai.app.dev
---
- runFlow: ../../../tests/native/open-workspace.yaml
- extendedWaitUntil:
    visible:
      id: channel-row-general
    timeout: 30000
- runFlow:
    file: ../../../tests/native/open-app-link.yaml
    env:
      LINK: "bubai://device?user_code=ABCD1234"
- assertVisible: "输入你正在登录的 CLI 上显示的设备码"
- assertVisible: "ABCD1234"
- assertVisible: "登录"
- runFlow:
    file: ../../../tests/native/open-app-link.yaml
    env:
      LINK: "bubai://invite/fixture-invite"
- assertVisible: "社区邀请"
- assertVisible: "登录后查看邀请"
