appId: com.bubai.app.dev
---
- runFlow: ../../../tests/native/open-workspace.yaml
- runFlow:
    when:
      visible: Live
    commands:
      - tapOn: Live
- runFlow:
    when:
      visible:
        id: server-url
    commands:
      - tapOn:
          id: server-url
      - eraseText
      - inputText: "${AUTH_SERVER}"
      - pressKey: Enter
- runFlow:
    when:
      visible:
        id: channel-row-general
    commands:
      - tapOn:
          id: settings-tab
      - scrollUntilVisible:
          element: ".*Sign Out.*"
          direction: DOWN
      - tapOn: ".*Sign Out.*"
- assertVisible: "发送验证码"
- assertVisible: "注册账号"
- tapOn: "使用邮箱密码登录"
- tapOn:
    id: auth-email
- inputText: "${TEST_EMAIL}"
- tapOn:
    id: auth-password
- inputText: "${TEST_PASSWORD}"
- pressKey: Enter
- tapOn:
    text: "以后|Not Now"
    optional: true
- extendedWaitUntil:
    visible:
      id: channel-row-general
    timeout: 15000
- stopApp
- launchApp
- assertVisible:
    id: channel-row-general
- tapOn: "Live"
- tapOn:
    id: server-url
- eraseText
- inputText: "${OPEN_SERVER}"
- pressKey: Enter
- assertVisible:
    id: channel-row-general
