appId: com.bubai.app.dev
---
- runFlow: ../../../tests/native/sign-in-workspace.yaml
- stopApp
- launchApp
- assertVisible:
    id: channel-row-general
- tapOn:
    id: workspace-more
- tapOn:
    id: change-connection
- tapOn:
    id: server-url
- eraseText
- inputText: "${OPEN_SERVER}"
- pressKey: Enter
- assertVisible:
    id: channel-row-general
