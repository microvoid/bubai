appId: com.bubai.app.dev
---
- runFlow: ../../../tests/native/open-workspace.yaml
- assertVisible:
    id: channel-row-general
- openLink: "bubai://channel/${ARCHIVED_CHANNEL}"
- tapOn:
    text: "打开|Open"
    optional: true
- tapOn:
    id: message-input
- eraseText
- inputText: "Keep rejected draft"
- tapOn:
    id: send-message
- assertVisible: "This channel is archived."
- tapOn: "OK|好|确定"
- assertVisible: "Keep rejected draft"
