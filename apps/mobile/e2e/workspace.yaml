appId: com.bubai.app.dev
---
- runFlow: ../../../tests/native/open-workspace.yaml
- tapOn:
    id: activity-tab
- assertVisible: "@Mentions"
- tapOn: "@Mentions"
- tapOn: "Threads"
- tapOn:
    id: messages-tab
- tapOn:
    id: channel-row-general
- tapOn:
    id: message-input
- eraseText
- inputText: "@Local"
- runFlow:
    when:
      platform: Android
    commands:
      - hideKeyboard
- assertVisible: ".*@Local Fixture.*"
- tapOn:
    id: message-input
- eraseText
- runFlow:
    when:
      platform: Android
    commands:
      - hideKeyboard
- tapOn: "频道设置与成员"
- assertVisible: "保存频道信息"
- assertVisible: ".*follow_source"
- scrollUntilVisible:
    element: "标星"
    direction: DOWN
- tapOn: "标星"
- assertVisible: "取消标星"
- tapOn: "取消标星"
- assertVisible: "标星"
- tapOn: "静音"
- assertVisible: "取消静音"
- tapOn: "取消静音"
