services:
  bubai:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: bubai-server
    restart: unless-stopped
    env_file:
      - .env
    environment:
      PORT: ${PORT:-4000}
      STATIC_DIR: /app/apps/web/dist
    ports:
      - "${HOST_PORT:-4000}:${PORT:-4000}"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    # Note: Existing Caddy container on the server can reverse_proxy directly to this exposed port.
    # Uploads go to S3 when S3_BUCKET / S3_ACCESS_KEY_ID / S3_SECRET_ACCESS_KEY are set in .env.
