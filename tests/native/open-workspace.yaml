appId: com.bubai.app.dev
---
- launchApp
- runFlow:
    when:
      visible: "以后|Not Now"
    commands:
      - tapOn: "以后|Not Now"
- extendedWaitUntil:
    visible: "更多|登录 Bubai|连接 Bubai"
    timeout: 30000
- runFlow:
    when:
      visible:
        id: workspace-more
    commands:
      - tapOn:
          id: workspace-more
      - tapOn:
          id: change-connection
- runFlow:
    when:
      visible:
        id: change-server
    commands:
      - tapOn:
          id: change-server
- tapOn:
    id: server-url
- eraseText
- inputText: "${OPEN_SERVER}"
- pressKey: Enter
- extendedWaitUntil:
    visible:
      id: channel-row-general
    timeout: 30000
