appId: com.bubai.app.dev
---
- runFlow: open-workspace.yaml
- runFlow:
    when:
      visible:
        id: workspace-more
    commands:
      - tapOn:
          id: workspace-more
      - tapOn:
          id: change-connection
- runFlow:
    when:
      visible:
        id: server-url
    commands:
      - tapOn:
          id: server-url
      - eraseText
      - inputText: "${AUTH_SERVER}"
      - pressKey: Enter
- runFlow:
    when:
      visible:
        id: channel-row-general
    commands:
      - tapOn:
          id: workspace-more
      - tapOn:
          id: settings-tab
      - scrollUntilVisible:
          element: ".*退出登录.*"
          direction: DOWN
      - tapOn: ".*退出登录.*"
- assertVisible: "发送验证码"
- assertVisible: "注册账号"
- tapOn: "使用邮箱密码登录"
- tapOn:
    id: auth-email
- inputText: "${TEST_EMAIL}"
- tapOn:
    id: auth-password
- inputText: "${TEST_PASSWORD}"
- pressKey: Enter
- tapOn:
    text: "以后|Not Now"
    optional: true
- extendedWaitUntil:
    visible:
      id: channel-row-general
    timeout: 15000
