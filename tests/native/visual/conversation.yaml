appId: com.bubai.app.dev
---
- stopApp
- runScript: find-discussion.js
- runScript: read-thread.js
- runFlow: ../open-workspace.yaml
- waitForAnimationToEnd
- takeScreenshot: 01-home
- retry:
    maxRetries: 2
    commands:
      - runFlow:
          when:
            notVisible: 切换社区
          commands:
            - tapOn:
                id: workspace-more
      - assertVisible: 切换社区
- assertVisible: "外观"
- waitForAnimationToEnd
- takeScreenshot: 04-more
- tapOn:
    point: "50%,20%"
- tapOn:
    id: channel-row-native-discussion
- assertVisible: ".*Native review.*"
- waitForAnimationToEnd
- takeScreenshot: 02-channel
- tapOn: "(?s).*条回复.*Preview from a colleague.*"
- assertVisible:
    id: message-input
- assertVisible: "话题"
- waitForAnimationToEnd
- takeScreenshot: 03-thread
