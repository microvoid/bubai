appId: com.bubai.app.dev
---
- stopApp
- runFlow: ../open-workspace.yaml
- runScript: create-interaction-room.js
- runFlow:
    file: ../open-app-link.yaml
    env:
      LINK: "bubai://thread/${output.discussion}/${output.root}"
- tapOn:
    id: message-input
- eraseText
- evalScript: ${output.reply = 'Native thread ' + Date.now()}
- inputText: "${output.reply}"
- runFlow:
    when:
      platform: Android
    commands:
      - hideKeyboard
- tapOn:
    id: send-message
- tapOn:
    id: message-input
- inputText: Unsent draft before editing
- runFlow:
    when:
      platform: Android
    commands:
      - hideKeyboard
- stopApp
- launchApp
- extendedWaitUntil:
    visible:
      id: workspace-more
    timeout: 20000
- runFlow:
    file: ../open-app-link.yaml
    env:
      LINK: "bubai://thread/${output.discussion}/${output.root}"
- assertVisible: Unsent draft before editing
- takeScreenshot: draft-before-edit
- longPressOn: "${output.reply}"
- tapOn:
    id: message-action-edit
- takeScreenshot: editing-reply
- tapOn: 取消编辑
- assertNotVisible: 取消编辑
- assertVisible: Unsent draft before editing
- waitForAnimationToEnd
- takeScreenshot: draft-restored-after-cancel
- longPressOn: "${output.reply}"
- tapOn:
    id: message-action-edit
- tapOn:
    id: message-input
- eraseText
- inputText: Revised reply
- runFlow:
    when:
      platform: Android
    commands:
      - hideKeyboard
- tapOn:
    id: send-message
- assertNotVisible: 取消编辑
- assertVisible: "Revised reply.*"
- assertVisible: Unsent draft before editing
- waitForAnimationToEnd
- takeScreenshot: draft-restored-after-save
