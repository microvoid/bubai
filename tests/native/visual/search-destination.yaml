appId: com.bubai.app.dev
---
- stopApp
- runFlow: ../open-workspace.yaml
- runScript: create-interaction-room.js
- runScript: seed-search-results.js
- retry:
    maxRetries: 2
    commands:
      - tapOn: 搜索消息
      - assertVisible:
          id: message-search-input
- tapOn:
    id: message-search-input
- inputText: "${output.channelHit}"
- tapOn:
    id: "search-result-${output.channelResultId}"
- assertVisible:
    id: message-input
- assertVisible: "${output.channelHit}"
- waitForAnimationToEnd
- takeScreenshot: search-channel-message
- runFlow:
    file: ../open-app-link.yaml
    env:
      LINK: "bubai://search"
- runFlow:
    when:
      visible: 清除搜索内容
    commands:
      - tapOn: 清除搜索内容
- tapOn:
    id: message-search-input
- inputText: "${output.threadHit}"
- tapOn:
    id: "search-result-${output.threadResultId}"
- assertVisible: 话题
- assertVisible: "${output.threadHit}"
- waitForAnimationToEnd
- takeScreenshot: search-thread-reply
