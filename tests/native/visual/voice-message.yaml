appId: com.bubai.app.dev
---
- runFlow: ../open-workspace.yaml
- tapOn: "智能体语音"
- tapOn: "Local Fixture"
- waitForAnimationToEnd
- retry:
    maxRetries: 2
    commands:
      - runFlow:
          when:
            visible: "开始录音"
          commands:
            - tapOn: "开始录音"
      - runFlow:
          when:
            visible: "While using the app|使用应用时|Allow|允许"
          commands:
            - tapOn: "While using the app|使用应用时|Allow|允许"
      - assertVisible: "结束录音"
- tapOn: "结束录音"
- tapOn: "发送语音"
- extendedWaitUntil:
    visible: "播放语音消息"
    timeout: 20000
